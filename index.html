  <!-- Auto-switch from file:// to local HTTP server so YouTube embeds & real-time sync operate with legitimate HTTP origin -->
  <script>
    (function() {
      if (typeof window !== 'undefined' && window.location) {
        if (window.location.protocol.startsWith('http')) {
          try {
            var sp = new URLSearchParams(window.location.search);
            var handoff = sp.get('session_handoff');
            if (handoff) {
              sessionStorage.setItem('tumbuh_session', decodeURIComponent(handoff));
              sp.delete('session_handoff');
              var cleanSearch = sp.toString() ? ('?' + sp.toString()) : '';
              window.history.replaceState({}, document.title, window.location.pathname + cleanSearch + window.location.hash);
            }
          } catch(e) {}
        } else if (window.location.protocol === 'file:') {
          try {
            fetch('http://127.0.0.1:8765/api/sync?since=0', { mode: 'cors' })
              .then(function(res) {
                if (res.ok) {
                  var sess = sessionStorage.getItem('tumbuh_session');
                  var target = 'http://127.0.0.1:8765/index.html';
                  var parts = [];
                  if (sess) parts.push('session_handoff=' + encodeURIComponent(sess));
                  if (parts.length > 0) target += '?' + parts.join('&');
                  target += (window.location.hash || '');
                  window.location.replace(target);
                }
              })
              .catch(function() {});
          } catch(e) {}
        }
      }
    })();
  </script>
